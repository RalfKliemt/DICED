[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rollcoaster"
version = "0.1.0"
description = "Success chance calculator for chained dice rolls"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "GitHub Copilot" }
]

[project.scripts]
rollcoaster = "rollcoaster.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]