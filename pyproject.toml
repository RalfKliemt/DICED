[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rollcoaster"
version = "0.1.0"
description = "Success chance calculator for chained dice rolls"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "flask>=3,<4",
]
authors = [
    { name = "ralfk" }
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.scripts]
rollcoaster = "rollcoaster.main:main"
rollcoaster-web = "rollcoaster.web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rollcoaster = ["templates/*.html", "static/*.css"]